<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HR Bridge</title>
<style>
body{font:15px Arial;background:#f4f6fa;color:#202938;margin:0}header{background:#182b49;color:white;padding:22px 5%}main{max-width:1100px;margin:28px auto;padding:0 18px}.panel{background:white;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 2px 12px #14213d12}button{border:0;border-radius:7px;padding:10px 14px;background:#2763c5;color:white;cursor:pointer;margin:4px}input{padding:10px;border:1px solid #ccd4e0;border-radius:6px;margin:4px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:11px;border-bottom:1px solid #edf0f4}.muted,small{color:#68758a}
</style></head><body><header><b>HR Bridge</b><div>HH.ru → Bitrix24</div></header><main>
<section class="panel"><h2>Подключения</h2><button onclick="location.href='/auth/hh'">Подключить HH.ru</button><button onclick="settings()">Настройки интеграций</button><p id="connect" class="muted"></p></section>
<section class="panel"><h2>Импорт кандидатов</h2><button onclick="demo()">Демо-импорт</button><input id="vacancy" placeholder="ID вакансии HH.ru"><button onclick="sync()">Синхронизировать HH.ru</button><p id="msg" class="muted"></p></section>
<section class="panel"><h2>Кандидаты</h2><button onclick="load()">Обновить</button><div style="overflow:auto"><table><thead><tr><th>Кандидат</th><th>Контакты</th><th>Источник</th><th>Статус</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="panel"><h2>Журнал</h2><div id="logs" class="muted"></div></section></main>
<script>
async function api(u,o){let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.detail||"Ошибка");return j}
async function load(){let a=await api("/api/applicants");rows.innerHTML=a.map(x=>'<tr><td><b>'+(x.name||"—")+'</b><br><small>'+(x.vacancy_name||"")+'</small></td><td>'+(x.phone||"")+'<br>'+(x.email||"")+'</td><td>'+x.source+'</td><td>'+x.status+'</td><td>'+(x.bitrix_lead_id?"Лид "+x.bitrix_lead_id:'<button onclick="send('+x.id+')">В Bitrix24</button>')+'</td></tr>').join("")||'<tr><td colspan="5">Нет кандидатов</td></tr>';let l=await api("/api/logs");logs.innerHTML=l.map(x=>x.created_at+" · "+x.level+" · "+x.message).join("<br>")}
async function demo(){try{let x=await api("/api/demo/import",{method:"POST"});msg.textContent=x.message;load()}catch(e){msg.textContent=e.message}}
async function sync(){try{let x=await api("/api/hh/sync?vacancy_id="+encodeURIComponent(vacancy.value),{method:"POST"});msg.textContent="Обработано: "+x.processed;load()}catch(e){msg.textContent=e.message}}
async function send(id){try{let x=await api("/api/applicants/"+id+"/send",{method:"POST"});msg.textContent="Лид Bitrix24: "+x.lead_id;load()}catch(e){msg.textContent=e.message}}
async function settings(){let v={};for(let k of ["HH_CLIENT_ID","HH_CLIENT_SECRET","HH_REDIRECT_URI","BITRIX_WEBHOOK_URL"]){let x=prompt("Введите "+k+" (пусто — без изменений)");if(x)v[k]=x}if(Object.keys(v).length)await api("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});status()}
async function status(){let s=await api("/api/settings/status");connect.textContent="HH OAuth: "+(s.HH_ACCESS_TOKEN?"подключён":"не подключён")+" · Bitrix24: "+(s.BITRIX_WEBHOOK_URL?"настроен":"не настроен")}
load();status();
</script></body></html>
